<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imgge</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0f1d;
            --bg-secondary: #111827;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 25px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            color: var(--accent-color);
        }

        .main-container {
            margin-top: 120px;
            margin-bottom: 60px;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .upload-card {
            background: var(--bg-secondary);
            border: 2px dashed #1e3a8a;
            border-radius: 16px;
            padding: 50px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .upload-card:hover {
            border-color: var(--accent-color);
            background: #121b2e;
            transform: translateY(-2px);
        }

        .upload-card i.main-icon {
            font-size: 64px;
            color: var(--accent-color);
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(37, 99, 235, 0.2);
        }

        .upload-card h3 {
            font-size: 22px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .upload-card p {
            color: var(--text-muted);
            font-size: 14px;
        }

        #file-input {
            display: none;
        }

        .preview-box {
            display: none;
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 25px;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .preview-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .preview-image-wrapper {
            width: 90px;
            height: 90px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: #000;
        }

        .preview-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-info h4 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .preview-info p {
            color: var(--text-muted);
            font-size: 13px;
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .link-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .link-group label {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .link-group label i {
            color: var(--accent-color);
            font-size: 12px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 14px 16px;
            padding-left: 100px;
            border-radius: 8px;
            color: #e5e7eb;
            font-size: 14px;
            direction: ltr;
            transition: border-color 0.2s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .copy-btn {
            position: absolute;
            left: 6px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .copy-btn:hover {
            background: var(--accent-hover);
        }

        footer {
            width: 100%;
            padding: 20px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-layer-group"></i>
            <span>imgge</span>
        </div>
    </header>

    <main class="main-container">
        
        <div class="upload-card" onclick="document.getElementById('file-input').click()">
            <i class="fa-solid fa-cloud-arrow-up main-icon"></i>
            <h3>اسحب وأفلت الصورة هنا</h3>
            <p>أو اضغط لتصفح الملفات من جهازك</p>
            <input type="file" id="file-input" accept="image/*" onchange="handleImageUpload(event)">
        </div>

        <div class="preview-box" id="preview-box">
            <div class="preview-header">
                <div class="preview-image-wrapper">
                    <img id="image-render" src="" alt="">
                </div>
                <div class="preview-info">
                    <h4 id="file-name"></h4>
                    <p id="file-size"></p>
                </div>
            </div>

            <div class="links-grid">
                
                <div class="link-group">
                    <label><i class="fa-solid fa-code"></i> صور المعرض بالكامل HTML</label>
                    <div class="input-wrapper">
                        <input type="text" id="link-html" readonly>
                        <button class="copy-btn" onclick="copyText('link-html', this)">
                            <i class="fa-regular fa-copy"></i> نسخ
                        </button>
                    </div>
                </div>

                <div class="link-group">
                    <label><i class="fa-solid fa-link"></i> رابط صورة</label>
                    <div class="input-wrapper">
                        <input type="text" id="link-direct" readonly>
                        <button class="copy-btn" onclick="copyText('link-direct', this)">
                            <i class="fa-regular fa-copy"></i> نسخ
                        </button>
                    </div>
                </div>

                <div class="link-group">
                    <label><i class="fa-solid fa-compress"></i> رابط صورة مصغرة</label>
                    <div class="input-wrapper">
                        <input type="text" id="link-thumb" readonly>
                        <button class="copy-btn" onclick="copyText('link-thumb', this)">
                            <i class="fa-regular fa-copy"></i> نسخ
                        </button>
                    </div>
                </div>

                <div class="link-group">
                    <label><i class="fa-solid fa-expand"></i> رابط صورة مكبرة</label>
                    <div class="input-wrapper">
                        <input type="text" id="link-large" readonly>
                        <button class="copy-btn" onclick="copyText('link-large', this)">
                            <i class="fa-regular fa-copy"></i> نسخ
                        </button>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 imgge جميع الحقوق محفوظة.</p>
    </footer>

    <script>
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('file-name').innerText = file.name;
            document.getElementById('file-size').innerText = (file.size / 1024).toFixed(1) + ' KB';

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                
                document.getElementById('image-render').src = base64Data;

                const dummyDomain = "https://imgge.com/i/";
                const randomId = Math.random().toString(36).substring(2, 10);
                
                const directLink = dummyDomain + randomId + ".png";
                const htmlLink = `<img src="${directLink}" alt="${file.name}" border="0">`;
                const thumbLink = dummyDomain + randomId + "_thumb.png";
                const largeLink = dummyDomain + randomId + "_large.png";

                document.getElementById('link-html').value = htmlLink;
                document.getElementById('link-direct').value = directLink;
                document.getElementById('link-thumb').value = thumbLink;
                document.getElementById('link-large').value = largeLink;

                document.getElementById('preview-box').style.display = 'block';
                document.getElementById('preview-box').scrollIntoView({ behavior: 'smooth' });
            };
            
            reader.readAsDataURL(file);
        }

        function copyText(id, button) {
            const input = document.getElementById(id);
            input.select();
            input.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(input.value);

            const originalText = button.innerHTML;
            button.innerHTML = '<i class="fa-solid fa-check"></i> تم!';
            button.style.background = '#10b981';

            setTimeout(() => {
                button.innerHTML = originalText;
                button.style.background = 'var(--accent-color)';
            }, 2000);
        }
    </script>
</body>
</html>
